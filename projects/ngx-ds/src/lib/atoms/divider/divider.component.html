<div
  [class]="hostClasses()"
  [style.border-color]="color() || null"
  role="separator"
  [attr.aria-orientation]="orientation() === 'vertical' ? 'vertical' : null"
  [attr.aria-label]="shownLabel() || null"
>
  @if (shownLabel()) {
    <span class="divider__label">{{ shownLabel() }}</span>
  }
</div>
