@if (label()) {
  <span class="cp__label" [id]="id + '-label'">{{ label() }}</span>
}

<div
  class="cp"
  [class.cp--disabled]="isDisabled()"
  role="group"
  [attr.aria-labelledby]="label() ? id + '-label' : null"
>
  <!-- Preview swatch -->
  <div class="cp__preview" [style]="previewStyle()"></div>

  <div class="cp__sliders">
    <!-- Hue slider -->
    <label class="cp__slider-label" [for]="id + '-hue'">{{ i18n.colorHue }}</label>
    <input
      [id]="id + '-hue'"
      type="range"
      class="cp__range cp__range--hue"
      [value]="hue()"
      min="0"
      max="360"
      step="1"
      [disabled]="isDisabled() || null"
      (input)="onHueChange($event)"
    />

    <!-- Saturation slider -->
    <label class="cp__slider-label" [for]="id + '-sat'">{{ i18n.colorSaturation }}</label>
    <input
      [id]="id + '-sat'"
      type="range"
      class="cp__range cp__range--sat"
      [value]="saturation()"
      min="0"
      max="100"
      step="1"
      [disabled]="isDisabled() || null"
      [style.background]="gradientStyle()"
      (input)="onSatChange($event)"
    />

    <!-- Lightness slider -->
    <label class="cp__slider-label" [for]="id + '-light'">{{ i18n.colorLightness }}</label>
    <input
      [id]="id + '-light'"
      type="range"
      class="cp__range cp__range--light"
      [value]="lightness()"
      min="0"
      max="100"
      step="1"
      [disabled]="isDisabled() || null"
      [style.background]="lightnessStyle()"
      (input)="onLightChange($event)"
    />
  </div>

  <!-- Hex input (the label wraps it, so "HEX" counts as the disabled control's label) -->
  <label class="cp__hex-row">
    <input
      type="text"
      class="cp__hex-input"
      [value]="hexInput()"
      maxlength="7"
      placeholder="#000000"
      [attr.aria-label]="i18n.colorHex"
      [disabled]="isDisabled() || null"
      (input)="onHexInput($event)"
    />
    <span class="cp__hex-label">HEX</span>
  </label>
</div>
