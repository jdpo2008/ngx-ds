<div class="psm">
  <!-- Segmented bars + label -->
  <div class="psm__row">
    <div
      class="psm__bars"
      role="meter"
      [attr.aria-valuenow]="score()"
      aria-valuemin="0"
      aria-valuemax="4"
      [attr.aria-label]="i18n.passwordStrength"
      [attr.aria-valuetext]="strengthLabel() || null"
    >
      @for (seg of segments; track seg) {
        <div
          class="psm__bar"
          [class]="
            'psm__bar psm__bar--' + (score() >= seg && score() > 0 ? strengthLevel() : 'empty')
          "
        ></div>
      }
    </div>

    @if (showLabel() && password()) {
      <span class="psm__label psm__label--{{ strengthLevel() }}">
        {{ strengthLabel() }}
      </span>
    }
  </div>

  <!-- Requirements checklist -->
  @if (showRequirements() && password()) {
    <ul class="psm__requirements" [attr.aria-label]="i18n.passwordRequirements">
      @for (req of requirements(); track req.label) {
        <li class="psm__req" [class.psm__req--met]="req.met">
          <span class="psm__req-icon" aria-hidden="true"></span>
          {{ req.label }}
        </li>
      }
    </ul>
  }
</div>
