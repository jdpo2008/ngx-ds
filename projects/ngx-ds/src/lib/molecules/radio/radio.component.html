<label [for]="id" [class]="hostClasses()">
  <input
    type="radio"
    [id]="id"
    [name]="name()"
    [value]="value()"
    class="radio__input"
    [checked]="isChecked()"
    [disabled]="isDisabled()"
    (change)="onSelect()"
  />

  @if (labelPosition() === 'left' && label()) {
    <span class="radio__label">{{ label() }}</span>
  }

  <span class="radio__circle" aria-hidden="true">
    <span class="radio__dot"></span>
  </span>

  @if (labelPosition() === 'right' && label()) {
    <span class="radio__label">{{ label() }}</span>
  }
</label>
