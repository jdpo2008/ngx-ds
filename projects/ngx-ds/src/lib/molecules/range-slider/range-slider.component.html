@if (label()) {
  <span class="slider__label" [id]="id + '-label'">{{ label() }}</span>
}

@if (!range()) {
  <div class="slider__row">
    @if (showMinMax()) {
      <span class="slider__bound">{{ min() }}</span>
    }

    <div class="slider__rail" [style]="trackStyle()">
      <input
        class="slider__native"
        type="range"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="value()"
        [disabled]="isDisabled() || null"
        [attr.aria-labelledby]="label() ? id + '-label' : null"
        [attr.aria-label]="label() ? null : ariaLabel() || null"
        (input)="onInput($event)"
        (blur)="onBlur()"
      />
    </div>

    @if (showMinMax()) {
      <span class="slider__bound">{{ max() }}</span>
    }

    @if (showValue()) {
      <span class="slider__value">{{ value() }}</span>
    }
  </div>
} @else {
  <div class="slider__row" role="group" [attr.aria-labelledby]="label() ? id + '-label' : null">
    @if (showMinMax()) {
      <span class="slider__bound">{{ min() }}</span>
    }

    <div class="slider__rail slider__rail--range" [style]="rangeTrackStyle()">
      <input
        class="slider__native slider__native--range slider__native--start"
        type="range"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="values()[0]"
        [disabled]="isDisabled() || null"
        [attr.aria-label]="ariaLabelStart() || i18n.rangeStart"
        (input)="onStartInput($event)"
        (blur)="onBlur()"
      />
      <input
        class="slider__native slider__native--range slider__native--end"
        type="range"
        [min]="min()"
        [max]="max()"
        [step]="step()"
        [value]="values()[1]"
        [disabled]="isDisabled() || null"
        [attr.aria-label]="ariaLabelEnd() || i18n.rangeEnd"
        (input)="onEndInput($event)"
        (blur)="onBlur()"
      />
    </div>

    @if (showMinMax()) {
      <span class="slider__bound">{{ max() }}</span>
    }

    @if (showValue()) {
      <span class="slider__value">{{ values()[0] }} – {{ values()[1] }}</span>
    }
  </div>
}
