@if (label()) {
  <label class="number-input__label" [for]="id">{{ label() }}</label>
}

<div [class]="hostClasses()">
  <button
    type="button"
    class="number-input__btn"
    [disabled]="!canDecrement() || null"
    (click)="decrement()"
    [attr.aria-label]="i18n.decrement"
  >
    <ngx-ds-icon [icon]="MinusIcon" [size]="iconSize()" />
  </button>

  <input
    class="number-input__field"
    type="number"
    [id]="id"
    [attr.aria-label]="label() ? null : (ariaLabel() ?? null)"
    [attr.aria-invalid]="hasError() || null"
    [attr.aria-describedby]="errorText() || hint() ? messageId : null"
    [value]="value()"
    [min]="min() ?? null"
    [max]="max() ?? null"
    [step]="step()"
    [disabled]="isDisabled() || null"
    (change)="onInputChange($event)"
  />

  <button
    type="button"
    class="number-input__btn"
    [disabled]="!canIncrement() || null"
    (click)="increment()"
    [attr.aria-label]="i18n.increment"
  >
    <ngx-ds-icon [icon]="PlusIcon" [size]="iconSize()" />
  </button>
</div>

@if (errorText()) {
  <p [id]="messageId" role="alert" class="number-input__error">{{ errorText() }}</p>
} @else if (hint()) {
  <p [id]="messageId" class="number-input__hint">{{ hint() }}</p>
}
