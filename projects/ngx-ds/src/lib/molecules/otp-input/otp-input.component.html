<div [class]="wrapperClasses()" role="group" [attr.aria-label]="i18n.otpGroup">
  @for (i of indices(); track i) {
    <input
      #otpBox
      [class]="boxClasses()"
      [type]="inputType()"
      [inputMode]="inputMode()"
      maxlength="1"
      [value]="digits()[i] || ''"
      [attr.autocomplete]="i === 0 ? 'one-time-code' : 'off'"
      [disabled]="isDisabled() || null"
      [attr.aria-invalid]="hasError() || null"
      [attr.aria-describedby]="errorText() ? messageId : null"
      [attr.aria-label]="i18n.otpDigit(i + 1, indices().length)"
      [style.width]="boxDim()"
      [style.height]="boxDim()"
      [style.fontSize]="boxFs()"
      (input)="onInput($event, i)"
      (keydown)="onKeydown($event, i)"
      (paste)="onPaste($event)"
      (focus)="onFocus($event)"
      (blur)="onBlur()"
    />
  }
</div>
@if (errorText()) {
  <p [id]="messageId" class="otp__message" role="alert">{{ errorText() }}</p>
}
