@if (label()) {
  <span class="rating__label">{{ label() }}</span>
}

<div
  class="rating"
  role="group"
  [class.rating--disabled]="isDisabled()"
  [class.rating--readonly]="readonly()"
  (mouseleave)="onLeave()"
  [attr.aria-label]="label() || i18n.rating"
>
  @for (star of stars(); track star) {
    <button
      type="button"
      class="rating__star"
      [class.rating__star--filled]="isFilled(star)"
      [disabled]="isDisabled() || readonly() || null"
      (mouseenter)="onHover(star)"
      (click)="onClick(star)"
      [attr.aria-label]="i18n.ratingStar(star)"
      [attr.aria-pressed]="star === value()"
    >
      <ngx-ds-icon [icon]="StarIcon" [size]="iconSize()" />
    </button>
  }
</div>
