@if (label()) {
  <span class="rating__label">{{ label() }}</span>
}

<div
  class="rating"
  [class.rating--disabled]="disabled()"
  [class.rating--readonly]="readonly()"
  (mouseleave)="onLeave()"
  [attr.aria-label]="label() || 'Rating'"
>
  @for (star of stars(); track star) {
    <button
      type="button"
      class="rating__star"
      [class.rating__star--filled]="isFilled(star)"
      [disabled]="disabled() || readonly() || null"
      (mouseenter)="onHover(star)"
      (click)="onClick(star)"
      [attr.aria-label]="star + ' estrella' + (star > 1 ? 's' : '')"
    >
      <ngx-ds-icon [icon]="StarIcon" [size]="iconSize()" />
    </button>
  }
</div>
