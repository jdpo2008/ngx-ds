<div [class]="hostClasses()" role="group" (focusout)="onFocusOut()">
  @for (option of options(); track option.value) {
    <button
      type="button"
      class="segmented__option"
      [class.segmented__option--active]="isSelected(option)"
      [class.segmented__option--disabled]="option.disabled"
      [disabled]="isDisabled() || option.disabled || null"
      [attr.aria-pressed]="isSelected(option)"
      (click)="select(option)"
    >
      {{ option.label }}
    </button>
  }
</div>
