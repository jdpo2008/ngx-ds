<div [class]="hostClasses()" role="group">
  @for (chip of chips(); track chip.value) {
    <span
      class="chip"
      [class.chip--selected]="isSelected(chip)"
      [class.chip--disabled]="chip.disabled || disabled()"
    >
      <button
        type="button"
        class="chip__label"
        [disabled]="chip.disabled || disabled() || null"
        [attr.aria-pressed]="selectable() ? isSelected(chip) : null"
        (click)="toggle(chip)"
      >
        {{ chip.label }}
      </button>

      @if (removable()) {
        <button
          type="button"
          class="chip__remove"
          [disabled]="chip.disabled || disabled() || null"
          [attr.aria-label]="'Quitar ' + chip.label"
          (click)="remove(chip, $event)"
        >
          <ngx-ds-icon [icon]="XIcon" [size]="12" />
        </button>
      }
    </span>
  }
</div>
