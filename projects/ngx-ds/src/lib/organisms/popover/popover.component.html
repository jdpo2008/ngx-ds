<div class="popover">
  <div
    #trigger
    class="popover__trigger"
    [attr.role]="nativeTrigger() ? null : 'button'"
    [attr.tabindex]="nativeTrigger() || disabled() ? null : 0"
    [attr.aria-expanded]="nativeTrigger() ? null : open()"
    [attr.aria-haspopup]="nativeTrigger() ? null : 'dialog'"
    (click)="toggle()"
    (keydown.enter)="onTriggerKey($event)"
    (keydown.space)="onTriggerKey($event)"
  >
    <ng-content select="[popover-trigger]" />
  </div>

  @if (open()) {
    <div [class]="panelClasses()" role="dialog" [attr.aria-label]="ariaLabel() ?? i18n.popover">
      <ng-content select="[popover-content]" />
    </div>
  }
</div>
