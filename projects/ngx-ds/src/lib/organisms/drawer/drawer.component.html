@if (open()) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click is a mouse shortcut; keyboard users close with Escape -->
  <div class="drawer-overlay" (click)="$event.target === $event.currentTarget && onBackdropClick()">
    <div
      [class]="panelClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || 'Panel lateral'"
      ngxFocusTrap
      tabindex="-1"
    >
      <div class="drawer__header">
        @if (title()) {
          <h2 class="drawer__title">{{ title() }}</h2>
        }
        <ng-content select="[drawer-header]" />
        @if (showClose()) {
          <ngx-ds-icon-button
            class="drawer__close"
            [icon]="icons.X"
            [ariaLabel]="i18n.close"
            variant="outline"
            color="secondary"
            size="sm"
            [bordered]="false"
            (click)="close()"
          />
        }
      </div>

      <div class="drawer__body">
        <ng-content />
      </div>

      <div class="drawer__footer">
        <ng-content select="[drawer-footer]" />
      </div>
    </div>
  </div>
}
