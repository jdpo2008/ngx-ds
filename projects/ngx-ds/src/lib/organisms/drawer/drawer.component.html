@if (open()) {
  <div class="drawer-overlay" (click)="onBackdropClick()">
    <div
      [class]="panelClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || 'Panel lateral'"
      ngxFocusTrap
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      <div class="drawer__header">
        @if (title()) {
          <h2 class="drawer__title">{{ title() }}</h2>
        }
        <ng-content select="[drawer-header]" />
        @if (showClose()) {
          <ngx-ds-icon-button
            class="drawer__close"
            [icon]="icons.X"
            ariaLabel="Cerrar"
            variant="outline"
            color="secondary"
            size="sm"
            [bordered]="false"
            (click)="close()"
          />
        }
      </div>

      <div class="drawer__body">
        <ng-content />
      </div>

      <div class="drawer__footer">
        <ng-content select="[drawer-footer]" />
      </div>
    </div>
  </div>
}
