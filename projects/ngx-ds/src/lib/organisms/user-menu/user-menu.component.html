<ngx-ds-popover [placement]="placement()">
  <!-- ── Trigger ─────────────────────────────────────────────────────────── -->
  <!-- Name as hidden text, not aria-label: the visible initials must not mismatch it. -->
  <button popover-trigger type="button" class="um__trigger">
    <span class="um__sr-only">{{ user().name }}</span>
    <ngx-ds-avatar
      [src]="user().avatarSrc"
      [alt]="user().name"
      [initials]="user().initials ?? ''"
      [color]="user().avatarColor ?? 'primary'"
      [size]="size()"
      aria-hidden="true"
    />
  </button>

  <!-- ── Panel ───────────────────────────────────────────────────────────── -->
  <div popover-content class="um__panel">
    <!-- Header: name + email only, no avatar -->
    <div class="um__header">
      <p class="um__name">{{ user().name }}</p>
      <p class="um__email">{{ user().email }}</p>
    </div>

    <ngx-ds-divider />

    <!-- Action list -->
    <div class="um__actions">
      @for (action of actions(); track action.id; let first = $first) {
        @if (action.separator && !first) {
          <ngx-ds-divider />
        }
        <ngx-ds-menu-button
          [iconLeft]="action.icon"
          [color]="action.color ?? 'default'"
          [disabled]="action.disabled ?? false"
          [fullWidth]="true"
          (click)="onAction(action)"
        >
          {{ action.label }}
        </ngx-ds-menu-button>
      }
    </div>
  </div>
</ngx-ds-popover>
