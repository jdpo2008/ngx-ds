<li
  class="tree-node"
  role="treeitem"
  [attr.aria-selected]="selectable() ? isSelected() : null"
  [attr.aria-disabled]="node().disabled ? 'true' : null"
  [attr.aria-expanded]="hasChildren() ? isExpanded() : null"
>
  <!-- Row -->
  <div
    [class]="rowClasses()"
    [style.paddingLeft]="indent()"
    tabindex="0"
    (click)="select()"
    (keydown)="onRowKey($event)"
  >
    <!-- Expand toggle -->
    <button
      type="button"
      class="tree-node__toggle"
      [class.tree-node__toggle--expanded]="isExpanded()"
      [style.visibility]="hasChildren() ? 'visible' : 'hidden'"
      (click)="toggle($event)"
      [attr.aria-label]="isExpanded() ? i18n.collapse : i18n.expand"
    >
      <ngx-ds-icon [icon]="ChevronRight" [size]="14" aria-hidden="true" />
    </button>

    <span class="tree-node__label">{{ node().label }}</span>
  </div>

  <!-- Children -->
  @if (hasChildren() && isExpanded()) {
    <ul class="tree-node__children" role="group">
      @for (child of node().children; track child.id) {
        <ngx-ds-tree-node
          [node]="child"
          [depth]="depth() + 1"
          [selected]="selected()"
          [expanded]="expanded()"
          [selectable]="selectable()"
          (nodeSelect)="bubbleSelect($event)"
          (nodeToggle)="bubbleToggle($event)"
        />
      }
    </ul>
  }
</li>
