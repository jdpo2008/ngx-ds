@if (state().isOpen) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click is a mouse shortcut; keyboard users close with Escape -->
  <div
    class="confirmation-overlay"
    (click)="$event.target === $event.currentTarget && onBackdropClick()"
  >
    <div
      class="confirmation-modal"
      [class.confirmation-modal--danger]="state().type === 'danger'"
      [class.confirmation-modal--warning]="state().type === 'warning'"
      role="dialog"
      aria-modal="true"
      aria-labelledby="ngx-confirmation-title"
      ngxFocusTrap
      tabindex="-1"
    >
      <div class="confirmation-modal__header">
        @if (state().type === 'danger') {
          <div class="confirmation-modal__icon confirmation-modal__icon--danger">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
              />
            </svg>
          </div>
        } @else if (state().type === 'warning') {
          <div class="confirmation-modal__icon confirmation-modal__icon--warning">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"
              />
            </svg>
          </div>
        } @else {
          <div class="confirmation-modal__icon confirmation-modal__icon--info">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" aria-hidden="true">
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                stroke-width="2"
                d="M13 16h-1v-4h-1m1-4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"
              />
            </svg>
          </div>
        }
      </div>

      <div class="confirmation-modal__body">
        <h2 class="confirmation-modal__title" id="ngx-confirmation-title">{{ state().title }}</h2>
        <p class="confirmation-modal__message">{{ state().message }}</p>
      </div>

      <div class="confirmation-modal__footer">
        <ngx-ds-button variant="solid" color="danger" (click)="onCancel()">{{
          state().cancelText
        }}</ngx-ds-button>
        <ngx-ds-button variant="solid" color="primary" (click)="onConfirm()">{{
          state().confirmText
        }}</ngx-ds-button>
      </div>
    </div>
  </div>
}
