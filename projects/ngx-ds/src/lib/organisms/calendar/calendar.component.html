<div class="calendar" [class.calendar--disabled]="disabled()">
  <!-- Header -->
  <div class="calendar__header">
    <button type="button" class="calendar__nav-btn" (click)="prevMonth()" aria-label="Mes anterior">
      <ngx-ds-icon [icon]="ChevronLeft" [size]="18" />
    </button>
    <span class="calendar__title">{{ title() }}</span>
    <button
      type="button"
      class="calendar__nav-btn"
      (click)="nextMonth()"
      aria-label="Mes siguiente"
    >
      <ngx-ds-icon [icon]="ChevronRight" [size]="18" />
    </button>
  </div>

  <!-- Weekday headers -->
  <div class="calendar__weekdays" aria-hidden="true">
    @for (d of weekdays; track d) {
      <span class="calendar__weekday">{{ d }}</span>
    }
  </div>

  <!-- Day grid (WAI-ARIA grid with roving tabindex) -->
  <div #grid class="calendar__grid" role="grid" [attr.aria-label]="title()">
    @for (week of weeks(); track $index) {
      <div class="calendar__week" role="row">
        @for (cell of week; track cell.date.getTime()) {
          <button
            type="button"
            class="calendar__day"
            role="gridcell"
            [class.calendar__day--other]="!cell.inMonth"
            [class.calendar__day--today]="cell.isToday"
            [class.calendar__day--selected]="cell.isSelected"
            [class.calendar__day--disabled]="cell.isDisabled"
            [disabled]="disabled() || null"
            [attr.aria-disabled]="cell.isDisabled || null"
            [attr.aria-label]="dayLabel(cell.date)"
            [attr.aria-selected]="cell.isSelected"
            [attr.aria-current]="cell.isToday ? 'date' : null"
            [attr.tabindex]="isFocusTarget(cell) ? 0 : -1"
            (click)="selectDay(cell)"
            (keydown)="onDayKeydown($event, cell)"
          >
            {{ cell.date.getDate() }}
          </button>
        }
      </div>
    }
  </div>
</div>
