@if (open()) {
  <div class="modal-overlay" (click)="onBackdropClick()">
    <div
      [class]="panelClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || 'Diálogo'"
      ngxFocusTrap
      tabindex="-1"
      (click)="$event.stopPropagation()"
    >
      <!-- ── Header ──────────────────────────────────────────────── -->
      <div class="modal__header">
        @if (title()) {
          <h2 class="modal__title">{{ title() }}</h2>
        }
        <ng-content select="[modal-header]" />
        @if (showClose()) {
          <ngx-ds-icon-button
            class="modal__close"
            [icon]="icons.X"
            ariaLabel="Cerrar"
            variant="outline"
            color="secondary"
            size="sm"
            [bordered]="false"
            (click)="close()"
          />
        }
      </div>

      <!-- ── Body ────────────────────────────────────────────────── -->
      <div class="modal__body">
        <ng-content />
      </div>

      <!-- ── Footer ──────────────────────────────────────────────── -->
      <div class="modal__footer">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
