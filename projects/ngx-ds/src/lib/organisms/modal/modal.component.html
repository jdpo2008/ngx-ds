@if (open()) {
  <!-- eslint-disable-next-line @angular-eslint/template/click-events-have-key-events, @angular-eslint/template/interactive-supports-focus -- backdrop click is a mouse shortcut; keyboard users close with Escape -->
  <div class="modal-overlay" (click)="$event.target === $event.currentTarget && onBackdropClick()">
    <div
      [class]="panelClasses()"
      role="dialog"
      aria-modal="true"
      [attr.aria-label]="title() || i18n.dialog"
      ngxFocusTrap
      tabindex="-1"
    >
      <!-- ── Header ──────────────────────────────────────────────── -->
      <div class="modal__header">
        @if (title()) {
          <h2 class="modal__title">{{ title() }}</h2>
        }
        <ng-content select="[modal-header]" />
        @if (showCloseButton()) {
          <ngx-ds-icon-button
            class="modal__close"
            [icon]="icons.X"
            [ariaLabel]="i18n.close"
            variant="outline"
            color="secondary"
            size="sm"
            [bordered]="false"
            (click)="close()"
          />
        }
      </div>

      <!-- ── Body ────────────────────────────────────────────────── -->
      <div class="modal__body">
        <ng-content />
      </div>

      <!-- ── Footer ──────────────────────────────────────────────── -->
      <div class="modal__footer">
        <ng-content select="[modal-footer]" />
      </div>
    </div>
  </div>
}
