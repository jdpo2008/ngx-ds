name: Release

# Publishes @jdpo2008/ngx-ds to npm when a GitHub release is published.
# The release tag must be `v<version>` and match projects/ngx-ds/package.json.
# A prerelease version (1.0.0-rc.1) is published to the `next` dist-tag.
# A stable version is published to `latest`, and `next` is moved to it too.
# Requires the repository secret NPM_TOKEN (an npm automation/granular token
# with publish rights on the @jdpo2008 scope).

on:
  release:
    types: [published]

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          registry-url: https://registry.npmjs.org

      - name: Check tag matches package version
        run: |
          version=$(node -p "require('./projects/ngx-ds/package.json').version")
          if [ "${GITHUB_REF_NAME}" != "v${version}" ]; then
            echo "::error::Tag ${GITHUB_REF_NAME} does not match package version v${version}"
            exit 1
          fi

      - run: npm ci

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test --watch=false

      - name: Test schematics
        run: npm run test:schematics

      - name: Build library
        run: npm run build

      # A prerelease version (1.0.0-rc.1) goes to the `next` dist-tag, a stable one to `latest`.
      - name: Publish
        run: |
          version=$(node -p "require('./projects/ngx-ds/package.json').version")
          case "$version" in
            *-*) tag=next ;;
            *) tag=latest ;;
          esac
          echo "Publishing $version with dist-tag $tag"
          npm publish ./dist/ngx-ds --access public --tag "$tag"
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}

      # After a stable release, `next` would still point to the last prerelease
      # (older than `latest`). Move it to the stable version.
      - name: Point next to the stable version
        if: ${{ !contains(github.ref_name, '-') }}
        run: |
          version=$(node -p "require('./projects/ngx-ds/package.json').version")
          npm dist-tag add "@jdpo2008/ngx-ds@${version}" next
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
