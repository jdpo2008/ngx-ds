name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - name: Format
        run: npm run format:check

      - name: Changelog fragments
        run: npm run changelog -- --check

      - name: Lint
        run: npm run lint

      - name: Test
        run: npx ng test --watch=false

      - name: Test schematics
        run: npm run test:schematics

      - name: Build library
        run: npm run build

      - name: Build Storybook
        run: npm run build-storybook

      - uses: actions/upload-artifact@v4
        with:
          name: storybook-static
          path: storybook-static
          retention-days: 3

      - uses: actions/upload-artifact@v4
        with:
          name: ngx-ds-dist
          path: dist/ngx-ds
          retention-days: 3

  bundle-size:
    if: github.event_name == 'pull_request'
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: write
    env:
      BASE_SHA: ${{ github.event.pull_request.base.sha }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - uses: actions/download-artifact@v4
        with:
          name: ngx-ds-dist
          path: dist/ngx-ds

      # Build the target branch in a worktree to compare against.
      - name: Build base
        run: |
          git fetch --depth=1 origin "$BASE_SHA"
          git worktree add ../base "$BASE_SHA"
          cd ../base
          npm ci
          npm run build

      - name: Compare bundle size
        run: npm run size -- --base ../base/dist/ngx-ds --markdown size.md

      # One comment per PR, updated on every push.
      - name: Comment on the PR
        if: always() && hashFiles('size.md') != ''
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
        run: |
          cat size.md >> "$GITHUB_STEP_SUMMARY"
          id=$(gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" --paginate             --jq '.[] | select(.body | startswith("<!-- bundle-size -->")) | .id' | head -1)
          if [ -n "$id" ]; then
            gh api -X PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$id" -F body=@size.md
          else
            gh api "repos/$GITHUB_REPOSITORY/issues/$PR/comments" -F body=@size.md
          fi

  a11y:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Accessibility (axe on every story)
        run: npm run test:a11y

  visual:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same image as `npm run test:visual:docker`, so fonts render like the baselines.
    # Keep the tag in step with the playwright version in package.json.
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - uses: actions/download-artifact@v4
        with:
          name: storybook-static
          path: storybook-static

      - name: Visual regression (screenshot every story)
        run: npm run test:visual

      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: visual-report
          path: visual-report
          retention-days: 7
