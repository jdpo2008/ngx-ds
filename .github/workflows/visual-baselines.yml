name: Update visual baselines

# Run from the Actions tab on a branch: it rebuilds Storybook, takes new screenshots of
# every story and commits them to visual-baselines/ on that branch. Pushes made with
# GITHUB_TOKEN do not start CI, so re-run the PR checks afterwards.

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    container: mcr.microsoft.com/playwright:v1.65.1-noble
    steps:
      - uses: actions/checkout@v7

      - run: npm ci

      - name: Build Storybook
        run: npm run build-storybook

      - name: Take new baselines
        run: npm run test:visual -- --update

      - name: Commit baselines
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A visual-baselines
          if git diff --cached --quiet; then
            echo "Baselines are up to date."
          else
            git commit -m "chore(visual): update baselines"
            git push
          fi
